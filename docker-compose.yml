# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml
#
# One-command local bring-up for the FastAPI coaching backend.
#
# Why only the backend?
#   • The Flutter app always runs on a physical device or emulator — containers
#     don't help there.
#   • The LLM is accessed via an OpenAI-compatible HTTP endpoint (DashScope,
#     Together, a local Ollama/vLLM, …). Swapping providers is purely an env-
#     var change (DEEPSEEK_BASE_URL), so this file intentionally stays minimal.
# ─────────────────────────────────────────────────────────────────────────────
version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Explicit service name helps other compose files (prod overrides, etc.)
    container_name: coaching-backend
    # Every setting lives in `.env` — keeps secrets out of source control.
    env_file:
      - .env
    ports:
      # Expose the uvicorn port so Flutter devices on the LAN can connect.
      - "${PORT:-8000}:8000"
    # Auto-restart if the process crashes — important because long-lived
    # WebSocket connections make stale containers noisy.
    restart: unless-stopped
    # Health-check hits the lightweight `/healthz` route.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;\nsys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
