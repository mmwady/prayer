# ─────────────────────────────────────────────────────────────────────────────
# backend/pyproject.toml
#
# Single source of truth for Python dependencies. Using pyproject (PEP 621)
# instead of requirements.txt because:
#   • It documents project metadata (name, python-requires) in one file.
#   • It plays nicely with both `pip install .` (Docker) and Poetry/uv locally.
#   • Dev-only deps stay out of the production image via the `[project.optional-
#     dependencies]` table.
# ─────────────────────────────────────────────────────────────────────────────
[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "coaching-backend"
version         = "0.1.0"
description     = "Iqtadi prayer backend (FastAPI + DeepSeek guidance + reference authoring)."
requires-python = ">=3.11"
readme          = "README.md"

dependencies = [
    # Web framework + ASGI server.
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    # Data validation & env-driven settings.
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pwdlib[argon2]>=0.2,<1",
    "email-validator>=2.2,<3",
    "tzdata>=2024.1",
    "Pillow>=10.4",
    # OpenAI-compatible async client — reaches DeepSeek (and any compatible
    # endpoint) without provider-specific code. Also provides httpx.
    "openai>=1.40",
    # FastAPI's TestClient and multipart upload parsing both need httpx.
    "httpx>=0.27",
    "python-multipart>=0.0.18",
    # Reference-video extraction for the admin authoring route. Imported
    # lazily so the guidance endpoints stay importable without them.
    "mediapipe==0.10.11",
    "numpy<2",
    "torch>=2.4,<3",
    "opencv-contrib-python>=4.8,<4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

# Tell setuptools where the code lives; avoids implicit discovery surprises.
[tool.setuptools.packages.find]
where    = ["."]
include  = ["app*"]

[tool.setuptools.package-data]
"app.admin" = ["*.html"]

# ─── Tooling defaults ───────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
