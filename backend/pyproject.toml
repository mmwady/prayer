# ─────────────────────────────────────────────────────────────────────────────
# backend/pyproject.toml
#
# Single source of truth for Python dependencies. Using pyproject (PEP 621)
# instead of requirements.txt because:
#   • It documents project metadata (name, python-requires) in one file.
#   • It plays nicely with both `pip install .` (Docker) and Poetry/uv locally.
#   • Dev-only deps stay out of the production image via the `[project.optional-
#     dependencies]` table.
# ─────────────────────────────────────────────────────────────────────────────
[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "coaching-backend"
version         = "0.1.0"
description     = "Real-time AI fitness coaching backend (FastAPI + LangGraph + DeepSeek)."
requires-python = ">=3.11"
readme          = "../README.md"

dependencies = [
    # Web framework + ASGI server for WebSockets.
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    # Async WebSocket protocol — uvicorn uses this when invoked with --ws websockets.
    "websockets>=12.0",
    # Data validation & env-driven settings.
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # LangGraph for stateful conversational orchestration.
    "langgraph>=0.2",
    "langchain-core>=0.2",
    # OpenAI-compatible async client — talks to DeepSeek / vLLM /
    # Ollama / Together etc. without provider-specific code.
    "openai>=1.40",
    # Default TTS engine: free, no key, Microsoft Edge voices.
    "edge-tts>=6.1",
    # Used by the ElevenLabs provider for streaming over WebSocket.
    "httpx>=0.27",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

# Tell setuptools where the code lives; avoids implicit discovery surprises.
[tool.setuptools.packages.find]
where    = ["."]
include  = ["app*"]

# ─── Tooling defaults ───────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
