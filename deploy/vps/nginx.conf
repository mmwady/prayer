server {
    listen 127.0.0.1:8080;
    server_name _;
    root /srv/iqtadi/current/web;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 3m;
    add_header X-Content-Type-Options nosniff always;
    add_header Permissions-Policy "camera=(self), microphone=()" always;
    location = /admin { return 404; }
    location ^~ /admin/ { return 404; }
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }
    location = /healthz {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Public access reaches this listener only through the HTTPS tunnel.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }
    location ~ \.wasm$ {
        types { application/wasm wasm; }
        try_files $uri =404;
    }
    location ~ \.m?js$ {
        types { text/javascript js mjs; }
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location ~ \.(onnx|task)$ {
        types { application/octet-stream onnx task; }
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }
    location /recognizer/ { try_files $uri $uri/ =404; }
    location /assets/ { try_files $uri =404; }
    location ~ \.json$ { try_files $uri =404; add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
