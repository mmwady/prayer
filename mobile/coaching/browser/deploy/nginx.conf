# Place inside your existing nginx http {} context, adjust domain/root/cert paths.
server {
    listen 80;
    server_name iqtadi.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name iqtadi.example.com;
    ssl_certificate /etc/letsencrypt/live/iqtadi.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iqtadi.example.com/privkey.pem;
    root /srv/iqtadi/build/web;
    include mime.types;
    default_type application/octet-stream;
    add_header X-Content-Type-Options nosniff always;
    add_header Permissions-Policy "camera=(self), microphone=()" always;

    # Recognizer has no prediction API and makes only static GET requests.
    location /recognizer/ {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self'; img-src 'self' blob: data:; style-src 'self'; font-src 'self'; media-src 'self' blob:; frame-ancestors 'self'" always;
    }
    location ~ \.wasm$ {
        types { application/wasm wasm; }
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }
    location ~ ^/recognizer/.*\.(onnx|task)$ {
        types { application/octet-stream onnx task; }
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }
    location ~ ^/recognizer/.*\.json$ {
        types { application/json json; }
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location ~ ^/recognizer/.*\.m?js$ {
        types { text/javascript js mjs; }
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
