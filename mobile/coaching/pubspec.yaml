# ─────────────────────────────────────────────────────────────────────────────
# mobile/pubspec.yaml
#
# Flutter manifest for the Iqtadi prayer movement learning app.
#
# Packages picked for concrete reasons (not just "popular"):
#   • camera           — official Flutter plugin; gives us a CameraController
#                        whose image stream is what a real pose model consumes.
#   • google_mlkit_pose_detection — on-device pose inference on Android/iOS.
#   • http             — reference download and Arabic guidance requests.
#   • provider         — lightweight state management for the prayer controller.
#   • js               — interop for the web MediaPipe wrapper.
# ─────────────────────────────────────────────────────────────────────────────

name: coaching
description: Iqtadi — Arabic prayer movement learning with on-device pose detection.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  camera: ^0.11.0
  provider: ^6.1.2
  http: ^1.6.0
  google_mlkit_pose_detection: ^0.12.0
  js: ^0.7.2
  shared_preferences: ^2.5.5
  flutter_secure_storage: 10.0.0
  qr_flutter: 4.1.0
  mobile_scanner: 7.2.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/prayer_positions/
    - assets/branding/
  fonts:
    - family: IqtadiArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic.ttf
